name: Draw Atlas weekly country briefings

on:
  schedule:
    # Every day at 12:37 UTC for retry. On each country's local Monday,
    # the runner becomes eligible to post the completed Monday-to-Sunday week.
    - cron: '37 12 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish missing weekly country briefings (unchecked = preview only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/draw-atlas-weekly.yml'
      - 'tools/draw-atlas/recurring/weekly*.py'

permissions:
  contents: read

concurrency:
  group: draw-atlas-blogger
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/draw-atlas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kerala PDF reader
        run: python -m pip install --disable-pip-version-check 'pdfminer.six==20260107'
      - name: Test weekly composition and duplicate handling
        run: python -m unittest discover -s recurring -p 'test_weekly*.py'
      - name: Check Blogger connection configuration
        id: config
        env:
          READY: ${{ secrets.BLOGGER_CLIENT_ID != '' && secrets.BLOGGER_CLIENT_SECRET != '' && secrets.BLOGGER_REFRESH_TOKEN != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [[ "$READY" == "true" ]]; then
            echo 'Blogger OAuth secrets are configured.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Blogger OAuth setup required: BLOGGER_CLIENT_ID, BLOGGER_CLIENT_SECRET, BLOGGER_REFRESH_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preview weekly briefings using public sources
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish) || steps.config.outputs.ready != 'true' }}
        run: python recurring/weekly.py
      - name: Publish missing weekly country briefings
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.config.outputs.ready == 'true' }}
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python recurring/weekly.py --publish
      - name: Report missing publishing authorization
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.config.outputs.ready == 'false' }}
        run: |
          echo '::error::Connect the Draw Atlas Blogger account. See tools/draw-atlas/README.md.'
          exit 1
